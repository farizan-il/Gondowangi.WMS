name: Deploy Warehouse Gondowangi
on:
  push:
    branches: [ master ]

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Install NPM & Build Assets
      run: |
        npm install
        npm run build

    - name: Sync files via SFTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 65002
        protocol: sftp
        # File akan dikirim ke folder ini
        server-dir: domains/warehouse.gondowangi.com/
        # Abaikan file sensitif agar tidak menimpa .env yang sudah Anda buat di server
        exclude: |
          **/.git*
          **/node_modules/**
          .env
          .htaccess
          storage/*.key